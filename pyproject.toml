[project]
name = "taama-ccc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adam Rafiandri", email = "rafiandria23@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.0",
]

[project.scripts]
taama-ccc = "taama_ccc:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
